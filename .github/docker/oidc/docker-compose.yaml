---
services:
  nifi-toolkit:
    image: apache/nifi-toolkit:1.28.1@sha256:7a43836dcc7ac37c5243dd11792da3aaff1b28a1c0e06b41c23cb16118c42652
    container_name: nifi-toolkit
    entrypoint: /bin/bash
    command: /tmp/tls-scripts/nifi-gen-certs.sh
    volumes:
      - tls-cert:/tmp/tls-certs
      - tls-scripts:/tmp/tls-scripts
      - tls-cert-ca:/tmp/cert
    environment:
      - KEYSTORE_PASSWORD_NIFI=${KEYSTORE_PASSWORD_NIFI}
      - KEYSTORE_PASSWORD_NIFI_REG=${KEYSTORE_PASSWORD_NIFI_REG}
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
  nifi-registry:
    image: local-nifi-registry:test
    restart: always
    depends_on:
      nifi-toolkit:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      postgresql-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    volumes:
      - tls-cert-reg:/tmp/tls-certs
      - tls-cert-ca:/tmp/cert
      - tls-cert-pwd:/tmp/cert-pwd
    ports:
      - 127.0.0.1:18080:18080
    environment:
      - AUTH=oidc
      - NIFI_REGISTRY_WEB_HTTPS_PORT=18080
      - NIFI_REGISTRY_WEB_HTTP_HOST=0.0.0.0
      - KEYSTORE_PATH=/tmp/tls-certs/keystore.p12
      - KEYSTORE_TYPE=PKCS12
      - TRUSTSTORE_PATH=/tmp/tls-certs/truststore.p12
      - TRUSTSTORE_TYPE=PKCS12
      - NIFI_REG_KEY_PASSWORD_PATH=/tmp/cert-pwd/keystore-nifi-reg.pass
      - NIFI_REG_KEYSTORE_PASSWORD_PATH=/tmp/cert-pwd/keystore-nifi-reg.pass
      - NIFI_REG_TRUSTSTORE_PASSWORD_PATH=/tmp/cert-pwd/truststore.pass
      - INITIAL_ADMIN_IDENTITY=admin
      - NIFI_REG_USE_PGDB=true
      - NIFI_REG_DB_URL=jdbc:postgresql://postgresql:5432/postgres?sslResponseTimeout=5000&ssl=false
      - NIFI_REG_DB_USERNAME=postgres
      - NIFI_REG_DB_PASSWORD=${DB_PASSWORD}
      - OIDC_CLIENT_ID=frontend
      - OIDC_CLIENT_SECRET=frontend
      - "OIDC_DISCOVERY_URL_NEW=https://keycloak:8443/realms/nifi-test-realm/.well-known/openid-configuration"
      - NIFI_REG_DB_FLOW_AUTHORIZERS=cached
      - NIFI_REGISTRY_CHECK_HOST=nifi-registry
    container_name: local-nifi-registry
    hostname: nifi-registry
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "/opt/nifi-registry/scripts/ready.sh"
      start_period: 90s
      start_interval: 2s
      interval: 15s
      timeout: 5s
      retries: 3
  consul:
    image: hashicorp/consul:1.20@sha256:200471c74bc0965cd20c81eacc31a209873d5d9e599fe637ceb856b0cbbc518d
    ports:
      - 127.0.0.1:8500:8500
    hostname: consul
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O - http://127.0.0.1:8500/v1/status/leader | grep -q ':'"
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 12
  postgresql:
    image: postgres:16.8@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
    volumes:
      - pg-db:/var/lib/postgresql/data/pgdata
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    container_name: postgresql
    hostname: postgresql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U postgres -d postgres"
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
  postgresql-init:
    image: postgres:16.8@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
    restart: on-failure:3
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - pg-init-db:/tmp/init-scripts/
    environment:
      - PGPASSWORD=${DB_PASSWORD}
    entrypoint: psql
    command: "-h postgresql -p 5432 -U postgres -f /tmp/init-scripts/init.sql"
  keycloak:
    image: keycloak/keycloak:26.1.4@sha256:044a457e04987e1fff756be3d2fa325a4ef420fa356b7034ecc9f1b693c32761
    hostname: keycloak
    restart: on-failure:3
    depends_on:
      postgresql:
        condition: service_healthy
      postgresql-init:
        condition: service_completed_successfully
    volumes:
      - keycloak-init:/opt/keycloak/data/import
      - tls-cert:/tmp/tls-certs
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HTTPS_KEY_STORE_FILE: /tmp/tls-certs/keycloak-server.p12
      KC_HTTPS_KEY_STORE_PASSWORD: ${KEYCLOAK_TLS_PASS}
      KC_HTTPS_PORT: 8443
      KC_HTTP_ENABLED: false
    ports:
      - 28080:8080
      - 28443:8443
    command:
      - start-dev
      - "--import-realm"
      - "--hostname"
      - "https://localhost:28443"
      - "--hostname-backchannel-dynamic"
      - "true"
    # the management interface inherits the TLS settings of the main one, so /health/ready
    # is only reachable over HTTPS. Probe the listener instead: Quarkus opens it once the
    # boot sequence, including the realm import, has completed.
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8443"
      start_period: 30s
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  tls-scripts:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${GIT_BASE_DIR:-$BASE_DIR}/.github/workflows/sh/
  tls-cert:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/
  tls-cert-reg:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/nifi-registry/
  tls-cert-ca:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/ca/
  tls-cert-pwd:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/pwd/
  pg-db:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/pg-db
  pg-init-db:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${GIT_BASE_DIR:-$BASE_DIR}/.github/configuration/postgres/oidc/
  keycloak-init:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${GIT_BASE_DIR:-$BASE_DIR}/.github/configuration/keycloak/
