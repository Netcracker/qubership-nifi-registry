---
# Healthcheck override for the before-upgrade phase, where nifi-registry runs the 1.x image.
# That image ships neither ready.sh nor curl, so probe the API with busybox wget instead.
# Plain mode is unsecured, so an unauthenticated call to /nifi-registry-api/config returns 200.
# Address the registry by its hostname: it binds to that interface rather than to localhost.
services:
  nifi-registry:
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O /dev/null http://nifi-registry:18080/nifi-registry-api/config"
      start_period: 30s
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 5
