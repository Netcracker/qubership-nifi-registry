---
services:
  nifi-toolkit:
    image: apache/nifi-toolkit:1.28.1
    container_name: nifi-toolkit
    entrypoint: /bin/bash
    command: /tmp/tls-scripts/nifi-gen-certs.sh
    volumes:
      - tls-cert:/tmp/tls-certs
      - tls-scripts:/tmp/tls-scripts
    environment:
      - KEYSTORE_PASSWORD_NIFI=${KEYSTORE_PASSWORD_NIFI}
      - KEYSTORE_PASSWORD_NIFI_REG=${KEYSTORE_PASSWORD_NIFI_REG}
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
  nifi-registry:
    image: local-nifi-registry:test
    depends_on:
      nifi-toolkit:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
    volumes:
      - nifi-reg-db:/opt/nifi-registry/nifi-registry-current/database
      - nifi-reg-flow:/opt/nifi-registry/nifi-registry-current/flow_storage
      - tls-cert-reg:/tmp/tls-certs
      - tls-cert-pwd:/tmp/cert-pwd
    ports:
      - 127.0.0.1:18080:18080
    environment:
      - AUTH=tls
      - NIFI_REGISTRY_WEB_HTTPS_PORT=18080
      - NIFI_REGISTRY_WEB_HTTP_HOST=0.0.0.0
      - KEYSTORE_PATH=/tmp/tls-certs/keystore.p12
      - KEYSTORE_TYPE=PKCS12
      - TRUSTSTORE_PATH=/tmp/tls-certs/truststore.p12
      - TRUSTSTORE_TYPE=PKCS12
      - NIFI_REG_KEY_PASSWORD_PATH=/tmp/cert-pwd/keystore-nifi-reg.pass
      - NIFI_REG_KEYSTORE_PASSWORD_PATH=/tmp/cert-pwd/keystore-nifi-reg.pass
      - NIFI_REG_TRUSTSTORE_PASSWORD_PATH=/tmp/cert-pwd/truststore.pass
      - INITIAL_ADMIN_IDENTITY=admin
      - CONSUL_ENABLED=true
      #default NIFI_CONSUL_INT_FRAMEWORK = quarkus
      - CONSUL_URL=http://consul:8500
      - NIFI_REGISTRY_CHECK_HOST=nifi-registry
    container_name: local-nifi-registry
    hostname: nifi-registry
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "/opt/nifi-registry/scripts/ready.sh"
      start_period: 90s
      start_interval: 2s
      interval: 15s
      timeout: 5s
      retries: 3
  consul:
    image: hashicorp/consul:1.20
    ports:
      - 127.0.0.1:8500:8500
    hostname: consul
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O - http://127.0.0.1:8500/v1/status/leader | grep -q ':'"
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  tls-scripts:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${GIT_BASE_DIR:-$BASE_DIR}/.github/workflows/sh/
  tls-cert:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/
  tls-cert-reg:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/nifi-registry/
  tls-cert-pwd:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/pwd/
  nifi-reg-db:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/nifi-reg/database/
  nifi-reg-flow:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/nifi-reg/flow-storage/
