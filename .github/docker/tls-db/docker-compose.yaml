---
services:
  nifi-toolkit:
    image: apache/nifi-toolkit:1.28.1@sha256:7a43836dcc7ac37c5243dd11792da3aaff1b28a1c0e06b41c23cb16118c42652
    depends_on:
      consul:
        condition: service_healthy
    container_name: nifi-toolkit
    entrypoint: /bin/bash
    command: /tmp/tls-scripts/nifi-gen-certs.sh
    volumes:
      - tls-cert:/tmp/tls-certs
      - tls-scripts:/tmp/tls-scripts
    environment:
      - KEYSTORE_PASSWORD_NIFI=${KEYSTORE_PASSWORD_NIFI}
      - KEYSTORE_PASSWORD_NIFI_REG=${KEYSTORE_PASSWORD_NIFI_REG}
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - CONSUL_ACL_ENABLED=true
      - CONSUL_HOSTNAME=consul
      - CONSUL_TOKEN=${CONSUL_TOKEN}
  nifi-registry:
    image: ${NIFI_REG_IMAGE:-local-nifi-registry}:${NIFI_REG_IMAGE_TAG:-test}
    depends_on:
      nifi-toolkit:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      consul:
        condition: service_healthy
    volumes:
      - tls-cert-reg:/tmp/tls-certs
    ports:
      - 127.0.0.1:18080:18080
    environment:
      - AUTH=tls
      - NIFI_REGISTRY_WEB_HTTPS_PORT=18080
      - NIFI_REGISTRY_WEB_HTTP_HOST=0.0.0.0
      - KEYSTORE_PATH=/tmp/tls-certs/keystore.p12
      - KEYSTORE_TYPE=PKCS12
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD_NIFI_REG}
      - TRUSTSTORE_PATH=/tmp/tls-certs/truststore.p12
      - TRUSTSTORE_TYPE=PKCS12
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - INITIAL_ADMIN_IDENTITY=admin
      - NIFI_REG_USE_PGDB=true
      - dbUrl=jdbc:postgresql://postgresql:5432/postgres
      - dbUsername=postgres
      - dbPassword=${DB_PASSWORD}
      - CONSUL_ENABLED=true
      - CONSUL_URL=consul:8500
      - NIFI_CONSUL_INT_FRAMEWORK=spring
      - CONSUL_ACL_TOKEN=${CONSUL_TOKEN}
      - NIFI_REGISTRY_CHECK_HOST=nifi-registry
    container_name: local-nifi-registry
    hostname: nifi-registry
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "/opt/nifi-registry/scripts/ready.sh"
      start_period: 90s
      start_interval: 2s
      interval: 15s
      timeout: 5s
      retries: 3
  consul:
    image: hashicorp/consul:1.20@sha256:200471c74bc0965cd20c81eacc31a209873d5d9e599fe637ceb856b0cbbc518d
    volumes:
      - consul-conf:/consul/config
    ports:
      - 127.0.0.1:8500:8500
    hostname: consul
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O - http://127.0.0.1:8500/v1/status/leader | grep -q ':'"
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 12
  postgresql:
    image: postgres:16.8@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
    volumes:
      - pg-db:/var/lib/postgresql/data/pgdata
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    container_name: postgresql
    hostname: postgresql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U postgres -d postgres"
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  tls-scripts:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${GIT_BASE_DIR:-$BASE_DIR}/.github/workflows/sh/
  tls-cert:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/
  tls-cert-reg:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/nifi-registry/
  pg-db:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/pg-db/
  consul-conf:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${GIT_BASE_DIR:-$BASE_DIR}/.github/configuration/consul/
