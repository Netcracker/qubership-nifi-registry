---
name: docker-build-and-test

on:
  push:
    paths:
      - '.github/workflows/docker-build-and-test.yml'
      - '.github/workflows/maven-build.yaml'
      - 'nifi-registry-db-util/**'
      - 'nifi-registry-migration-util/**'
      - 'nifi-registry-util/**'
      - 'qubership-cached-providers/**'
      - 'qubership-nifi-registry-spring-consul/**'
      - 'qubership-nifi-registry-quarkus-consul/**'
      - 'qubership-nifi-registry-consul-common/**'
      - 'qubership-nifi-registry-consul-templates/**'
      - 'qubership-nifi-registry-openapi-enricher/**'
      - 'qubership-nifi-registry-deps/**'
      - 'nifi-registry-assembly/**'
      - 'docs/openapi/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'nifi-scripts/**'
      - '.github/actions/**'
      - '.github/collections/**'
      - '.github/docker/**'
      - '.github/configuration/**'
      - '.github/workflows/sh/**'
  # No path filter here: a workflow skipped by one never reports CI Gate, and a pull request that requires it stays
  # blocked. The changes job reads the paths instead.
  pull_request:
  workflow_dispatch:
    inputs:
      java-version:
        required: false
        type: string
        default: "25"
        description: 'Java version (e.g., 25)'
permissions:
  contents: read
jobs:
  changes:
    name: Detect tested changes
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.filter.outputs.tested }}
    steps:
      - name: Checkout code
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether the pull request changes tested paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Push events keep the path filter of the push trigger, and a manual run always tests.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The paths of the push trigger above. Keep the two lists in sync.
          pattern='^(\.github/workflows/(docker-build-and-test\.yml|maven-build\.yaml|sh/.*)'
          pattern+='|\.github/(actions|collections|docker|configuration)/'
          pattern+='|nifi-registry-(db-util|migration-util|util|assembly)/|qubership-cached-providers/'
          pattern+='|qubership-nifi-registry-(spring-consul|quarkus-consul|consul-common|consul-templates)/'
          pattern+='|qubership-nifi-registry-(openapi-enricher|deps)/'
          pattern+='|docs/openapi/|nifi-scripts/|pom\.xml$|Dockerfile$)'
          # Read the list first, so that a failed diff fails the job instead of skipping the tests.
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if grep -Eq "$pattern" <<< "$files"; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "No tested paths changed, so the build and the autotests are skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "tested=false" >> "$GITHUB_OUTPUT"
          fi
  mvn:
    needs: [ changes ]
    if: ${{ needs.changes.outputs.tested == 'true' }}
    uses: ./.github/workflows/maven-build.yaml
    with:
      java-version: ${{ github.event.inputs.java-version || '25' }}
      artifact-id: 'qubership-nifi-registry-local-build'
      upload-artifact: true
      skip-sonar: true
  docker-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        run-mode:
        - 'plain'
        - 'tls'
        - 'tls-db'
        - 'tls-quarkus'
        - 'tls-db-quarkus'
        - 'tls-db-std'
        - 'oidc'
        - 'upgrade-plain'
        - 'upgrade-tls-db'
        - 'upgrade-tls-db-std'
    needs: [ mvn ]
    runs-on: ubuntu-latest
    steps:
      - name: Input parameters
        shell: bash
        run: |
          mkdir -p ./test-results/
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: 'qubership-nifi-registry-local-build'
      - name: Run local docker build
        run: docker build -t local-nifi-registry:test .
      - name: Run upgrade tests with mode = ${{ matrix.run-mode }}
        if: ${{ startsWith(matrix.run-mode, 'upgrade-') }}
        uses: ./.github/actions/run-nifi-reg-upgrade-tests
        with:
          run-mode: '${{ matrix.run-mode }}'
      - name: Run tests with mode = ${{ matrix.run-mode }}
        if: "${{ !startsWith(matrix.run-mode, 'upgrade-') }}"
        uses: ./.github/actions/run-nifi-reg-tests-generic
        with:
          run-mode: '${{ matrix.run-mode }}'
      - name: Verify test results
        shell: bash
        run: |
          echo "Preparing summary..."
          {
            echo "## Autotests summary"
            echo "Run mode = ${{ matrix.run-mode }}"
            echo ""
            echo "| Step                                           | Result                     |"
            echo "| ---------------------------------------------- | -------------------------- |"
            cat ./test-results/*/summary_*.txt
            echo ""
          } >> $GITHUB_STEP_SUMMARY
          echo "Checking test results for failures..."
          failed_cnt=$(find ./test-results -name "failed_*.lst" | wc -l)
          echo "Found failed steps = $failed_cnt"
          if [ "$failed_cnt" == "0" ]; then
            echo "All tests were successful!"
            echo "All tests were successful!" >> $GITHUB_STEP_SUMMARY
          else
            echo "Some tests ($failed_cnt) failed. Marking as failure."
            echo "Some tests ($failed_cnt) failed. Marking as failure." >> $GITHUB_STEP_SUMMARY
            if [ -f ./docker.env ]; then
              if [ -d "./test-results/${{ matrix.run-mode }}" ]; then
                echo "Copying docker.env to test-results/${{ matrix.run-mode }}..."
                cp ./docker.env "./test-results/${{ matrix.run-mode }}/"
              fi
            fi
            exit 1;
          fi
      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nifi-registry-autotests-${{ matrix.run-mode }}-logs
          path: |
            ./test-results
          retention-days: 2
  # The required status check for pull requests. It runs even when a job it needs fails or is cancelled, because GitHub
  # counts a skipped required check as passed. It passes when no tested path changed, and otherwise only when the
  # build and every autotest passed.
  ci-gate:
    name: CI Gate
    needs: [ changes, mvn, docker-build-and-test ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if change detection, the build, or an autotest did not pass
        if: >-
          ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.tested == 'true'
          && (needs.mvn.result != 'success' || needs.docker-build-and-test.result != 'success')) }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "Results of the jobs CI Gate needs: ${NEEDS}"
          exit 1
