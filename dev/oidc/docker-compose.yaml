---
services:
  nifi-toolkit:
    image: apache/nifi-toolkit:1.28.1
    container_name: nifi-toolkit
    entrypoint: /bin/bash
    command: /tmp/tls-scripts/nifi-gen-certs.sh
    volumes:
      - tls-cert:/tmp/tls-certs
      - tls-scripts:/tmp/tls-scripts
    environment:
      - KEYSTORE_PASSWORD_NIFI=${KEYSTORE_PASSWORD}
      - KEYSTORE_PASSWORD_NIFI_REG=${KEYSTORE_PASSWORD}
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
  nifi-registry:
    image: ghcr.io/netcracker/nifi-registry:latest
    restart: always
    depends_on:
      nifi-toolkit:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      postgresql-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    volumes:
      - tls-cert-reg:/tmp/tls-certs
    ports:
      - 127.0.0.1:18080:18080
    environment:
      - AUTH=oidc
      - NIFI_REGISTRY_WEB_HTTPS_PORT=18080
      - NIFI_REGISTRY_WEB_HTTP_HOST=0.0.0.0
      - KEYSTORE_PATH=/tmp/tls-certs/keystore.p12
      - KEYSTORE_TYPE=PKCS12
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
      - TRUSTSTORE_PATH=/tmp/tls-certs/truststore.p12
      - TRUSTSTORE_TYPE=PKCS12
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - INITIAL_ADMIN_IDENTITY=CN=admin, OU=NIFI
      - NIFI_REG_USE_PGDB=true
      - NIFI_REG_DB_URL=jdbc:postgresql://postgresql:5432/postgres
      - NIFI_REG_DB_USERNAME=postgres
      - NIFI_REG_DB_PASSWORD=${DB_PASSWORD}
      - OIDC_CLIENT_ID=frontend
      - OIDC_CLIENT_SECRET=frontend
      - "OIDC_DISCOVERY_URL_NEW=http://keycloak:8080/realms/nifi-test-realm/.well-known/openid-configuration"
      - NIFI_REGISTRY_CHECK_HOST=nifi-registry
    container_name: local-nifi-registry-oidc
    hostname: nifi-registry
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "/opt/nifi-registry/scripts/ready.sh"
      start_period: 90s
      start_interval: 2s
      interval: 15s
      timeout: 5s
      retries: 3
  postgresql:
    image: postgres:16.8
    volumes:
      - pg-db:/var/lib/postgresql/data/pgdata
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    container_name: postgresql
    hostname: postgresql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U postgres -d postgres"
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
  postgresql-init:
    image: postgres:16.8
    restart: on-failure:3
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - pg-init-db:/tmp/init-scripts/
    environment:
      - PGPASSWORD=${DB_PASSWORD}
    entrypoint: psql
    command: "-h postgresql -p 5432 -U postgres -f /tmp/init-scripts/init.sql"
  keycloak:
    image: keycloak/keycloak:26.1.4
    hostname: keycloak
    restart: on-failure:3
    depends_on:
      postgresql:
        condition: service_healthy
      postgresql-init:
        condition: service_completed_successfully
    volumes:
      - keycloak-init:/opt/keycloak/data/import
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - 127.0.0.1:28080:8080
    command:
      - start-dev
      - "--import-realm"
      - "--hostname"
      - "http://localhost:28080"
      - "--hostname-backchannel-dynamic"
      - "true"
    #probe the listener: Quarkus opens it once the boot sequence,
    #including the realm import, has completed.
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8080"
      start_period: 30s
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  tls-scripts:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $GIT_REPO_DIR/.github/workflows/sh/
  tls-cert:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/
  tls-cert-reg:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/nifi-registry/
  pg-db:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/pg-db
  pg-init-db:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $GIT_REPO_DIR/dev/oidc/configuration/postgres/oidc/
  keycloak-init:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $GIT_REPO_DIR/dev/oidc/configuration/keycloak/
