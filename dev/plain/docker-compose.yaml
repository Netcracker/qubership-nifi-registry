---
services:
  nifi-registry:
    image: ghcr.io/netcracker/qubership-nifi-registry:latest@sha256:1c17370cd0dce821625e353bd569130b13b39c60397edbea86fce7d7a3f3a0ab
    volumes:
      - nifi-reg-db:/opt/nifi-registry/nifi-registry-current/database
      - nifi-reg-flow:/opt/nifi-registry/nifi-registry-current/flow_storage
    ports:
      - 127.0.0.1:18080:18080
    environment:
      - AUTH=none
      - NIFI_REGISTRY_CHECK_HOST=nifi-registry
    hostname: nifi-registry
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "/opt/nifi-registry/scripts/ready.sh"
      start_period: 90s
      start_interval: 2s
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  nifi-reg-db:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/nifi-reg/database/
  nifi-reg-flow:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/nifi-reg/flow-storage/
